name: Deploy Design System Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Docs site is canonical at pkhatrihc1.github.io/hc1-design-system/.
    # The hc1com mirror has Pages disabled by design; skip there instead of
    # failing every push with "Get Pages site failed".
    if: github.repository == 'pkhatriHC1/hc1-design-system'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            preview/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install preview dependencies
        run: npm install
        working-directory: preview

      - name: Build preview
        run: npm run build
        working-directory: preview

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
